<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login | Ordella</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar bg-white border-bottom"><div class="container"><a class="navbar-brand fw-bold fs-3" href="index.html">ordella<span class="text-success">.</span></a><a href="index.html" class="link-success text-decoration-none">← Back to home</a></div></nav><main class="container min-vh-100 d-flex align-items-center justify-content-center py-5"><div class="card border-0 shadow-sm w-100"><div class="card-body p-4 p-md-5"><div class="text-center mb-4"><div class="display-5">👋</div><h2 class="fw-bold mt-2">Welcome back</h2><p class="text-secondary">Log in to continue to your Ordella account.</p></div><form onsubmit="demoLogin(event)"><div class="mb-3"><label class="form-label fw-semibold">Email address</label><input type="email" class="form-control form-control-lg" placeholder="you@example.com" required></div><div class="mb-3"><label class="form-label fw-semibold">Password</label><input type="password" class="form-control form-control-lg" placeholder="Enter your password" required></div><div class="mb-4"><label class="form-label fw-semibold">I am logging in as</label><select id="loginRole" class="form-select form-select-lg" required><option value="">Choose account type</option><option value="seller-home.html">Seller / Owner</option><option value="customer-home.html">Customer</option></select></div><button class="btn btn-success btn-lg w-100" type="submit">Log in</button></form><p class="text-center text-secondary mt-4 mb-0">Don't have an account? <a class="link-success" href="signup.html">Sign up</a></p><div class="alert alert-info small mt-3 mb-0">Static demo only: authentication will be added in a later deliverable.</div></div></div></div></main><script>function demoLogin(e){e.preventDefault();const page=document.getElementById('loginRole').value;if(!page){alert('Please choose an account type.');return;}alert('Demo only: login is not connected yet. Opening the selected homepage.');window.location.href=page;}</script></body></html>
